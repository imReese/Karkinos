name: Inspect pinned TDX SDK

on:
  push:
    branches: [dev]
    paths: [.github/workflows/inspect-tdx-sdk.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read public wheel without importing SDK
        shell: python
        run: |
          import hashlib
          import io
          import re
          import subprocess
          import urllib.request
          import zipfile
          from pathlib import Path

          bundle = Path("inspect-bundle")
          bundle.mkdir()
          subprocess.run(["git", "archive", "--format=zip", "HEAD", "-o", str(bundle / "source.zip")], check=True)
          url = "https://files.pythonhosted.org/packages/a1/47/fcd55849d9a687232b389177395715f4f4c10d90946e13d5056ba1966b12/tdxaidata-1.0.2-py3-none-any.whl"
          with urllib.request.urlopen(url, timeout=30) as response:
              payload = response.read()
          expected = "9a81e37178d28641cad630d03d82217337be448fa1b02aa838202bc31ae03f51"
          if hashlib.sha256(payload).hexdigest() != expected:
              raise SystemExit("Pinned SDK wheel hash mismatch")
          (bundle / "tdxaidata-1.0.2-py3-none-any.whl").write_bytes(payload)
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              for name in archive.namelist():
                  if name.endswith(".ini"):
                      text = archive.read(name).decode("gb18030")
                      print("BUNDLED INI", name)
                      for line in text.splitlines():
                          if "=" in line and re.search(r"(?i)key|token|password|secret", line.split("=", 1)[0]):
                              print(line.split("=", 1)[0] + "=<redacted bundled default>")
                          else:
                              print(line)
                  elif name.endswith(".md"):
                      print("BUNDLED DOC", name)
                      print(archive.read(name).decode("utf-8-sig"))
                  elif name.endswith("/tdxaidata.py"):
                      print("PUBLIC WRAPPER REMAINDER", name)
                      for index, line in enumerate(archive.read(name).decode("utf-8-sig").splitlines()):
                          if 220 <= index < 370 or index >= 930:
                              print(f"{index + 1}: {line}")
          subprocess.run(["python", "-m", "pip", "download", "--no-deps", "ruff==0.16.6", "-d", str(bundle)], check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-source-inspection
          path: inspect-bundle/
          retention-days: 1
