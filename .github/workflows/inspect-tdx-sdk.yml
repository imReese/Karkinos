name: Stage reviewed runtime configuration

on:
  push:
    branches: [dev]
    paths: [.github/workflows/inspect-tdx-sdk.yml]

permissions: {}

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create only exact reviewed content blobs without executing source
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64
          import hashlib
          import io
          import json
          import os
          import subprocess
          import tempfile
          import urllib.request
          import zipfile
          from pathlib import Path

          api = "https://api.github.com/repos/imReese/Karkinos"
          base = "902382d381e92a75598903f21ecdda1f7c7eae54"
          patch_sha = "c7c31b4a5772b2a347e21d64a69f0ef31bec0394"
          expected = {
              ".env.example": "273e167ada2916f46a37c97cf292ecf9b23a947c",
              "data/providers/tdx.py": "e8fbcea9df9d9b78673e59d0700bf36d0f745080",
              "data/providers/tdx_runtime.py": "5686577f0c4e0ab1e3b025c8735f6eee65286e38",
              "pyproject.toml": "c4987eb841caa0825418c1e3fa398eb679b2c21d",
              "scripts/README.md": "bdf510f33ece2f61a5f57fc4c2adcd8eb9a92b71",
              "scripts/data/check_tdx_daily.py": "3016bf45d1787aed746d2f095d8f99837a3dda88",
              "server/bootstrap.py": "19db35eb815567614110f04b7081e910d2eb6ac9",
              "server/runtime_environment.py": "84733791b00697fbceebfa2f325730e94b0776dc",
              "tests/data/providers/test_tdx_runtime.py": "9a730fa13062eaebbf06ede389a3a2517c6e51d5",
              "tests/scripts/test_check_tdx_daily.py": "c5179184e05e8b6a314253d9e6dea8c483871d23",
              "tests/server/test_runtime_environment.py": "ad3c113db3bb08ef825a4a22168b0c1c4dddc549",
              "uv.lock": "57bf4798e2d8ed52b421838fbb01387855573253",
          }
          def request(path, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(api + path, data=body, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Content-Type": "application/json",
                  "Accept": "application/vnd.github+json",
              })
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          def blob_id(data):
              return hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
          patch = base64.b64decode(request("/git/blobs/" + patch_sha)["content"])
          assert blob_id(patch) == patch_sha
          with urllib.request.urlopen("https://codeload.github.com/imReese/Karkinos/zip/" + base, timeout=30) as response:
              archive = response.read()
          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
                  for member in bundle.infolist():
                      parts = Path(member.filename).parts[1:]
                      if not parts or member.is_dir():
                          continue
                      assert not Path(*parts).is_absolute() and ".." not in parts
                      target = root.joinpath(*parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(bundle.read(member))
              patch_file = root / "reviewed.patch"
              patch_file.write_bytes(patch)
              subprocess.run(["git", "apply", "--check", str(patch_file)], cwd=root, check=True)
              subprocess.run(["git", "apply", str(patch_file)], cwd=root, check=True)
              prepared = {name: (root / name).read_bytes() for name in expected}
              assert all(blob_id(data) == expected[name] for name, data in prepared.items())
              for name, data in prepared.items():
                  result = request("/git/blobs", {"content": base64.b64encode(data).decode(), "encoding": "base64"})
                  assert result["sha"] == expected[name]
                  print(json.dumps({"path": name, "sha": result["sha"]}))
