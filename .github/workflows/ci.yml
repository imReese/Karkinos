name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact dev commit SHA to verify
        required: true
        type: string
      base_sha:
        description: Exact main SHA used as the verification base
        required: true
        type: string

permissions:
  contents: read

env:
  UV_VERSION: "0.11.28"

concurrency:
  group: ci-${{ github.event_name }}-${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  plan:
    name: Verification plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      base_sha: ${{ steps.plan.outputs.base_sha }}
      commit_sha: ${{ steps.plan.outputs.commit_sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
      - name: Build verification plan
        id: plan
        shell: bash
        env:
          DISPATCH_COMMIT_SHA: ${{ inputs.commit_sha || '' }}
          DISPATCH_BASE_SHA: ${{ inputs.base_sha || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            [[ "${DISPATCH_COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]
            [[ "${DISPATCH_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
            test "${GITHUB_REF}" = refs/heads/dev
            test "${GITHUB_SHA}" = "${DISPATCH_COMMIT_SHA}"
            test "${commit_sha}" = "${DISPATCH_COMMIT_SHA}"
            git merge-base --is-ancestor "${DISPATCH_BASE_SHA}" "${DISPATCH_COMMIT_SHA}"
            base_sha="${DISPATCH_BASE_SHA}"
          else
            test "${commit_sha}" = "${GITHUB_SHA}"
            if [[ "${GITHUB_EVENT_NAME}" == pull_request ]]; then
              base_ref="${PR_BASE_SHA}"
            else
              test "${GITHUB_REF}" = refs/heads/dev
              base_ref=origin/main
            fi
            base_sha="$(git rev-parse --verify --end-of-options "${base_ref}^{commit}")"
            git merge-base --is-ancestor "${base_sha}" "${commit_sha}"
          fi
          {
            echo "base_sha=${base_sha}"
            echo "commit_sha=${commit_sha}"
          } >> "${GITHUB_OUTPUT}"

  python-quality:
    name: Python quality
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.commit_sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Check changed Python files and stable boundaries
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          COMMIT_SHA: ${{ needs.plan.outputs.commit_sha }}
        run: uv run --locked python scripts/ci/check_python_quality.py --base "${BASE_SHA}" --head "${COMMIT_SHA}"

  repository-integrity:
    name: Repository integrity
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit_sha }}
      - name: Check public shell entrypoints
        run: bash -n scripts/dev scripts/service/manage_launch_agent.sh scripts/release/bootstrap_installer.sh
      - name: Check public shell entrypoints with ShellCheck
        run: shellcheck scripts/dev scripts/service/manage_launch_agent.sh scripts/release/bootstrap_installer.sh
      - name: Check documentation integrity
        run: python scripts/ci/check_docs_integrity.py
      - name: Check tracked private artifacts
        shell: bash
        run: |
          set -euo pipefail
          forbidden_pattern='(^|/)(\.env$|\.env\.local$|\.env\.production$|.*\.(db|sqlite|sqlite3|duckdb)$|data/store/|logs/|exports/|screenshots/|reports/|\.agents/|skills-lock\.json$)'
          tracked_forbidden="$(git ls-files | grep -E "${forbidden_pattern}" || true)"
          test -z "${tracked_forbidden}"

  secret-scan:
    name: Secret scan
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit_sha }}
          fetch-depth: 0
      - name: Scan new commits with Gitleaks
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          COMMIT_SHA: ${{ needs.plan.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${BASE_SHA}" == 0000000000000000000000000000000000000000 ]]; then
            scan_range="${COMMIT_SHA}"
          else
            git merge-base --is-ancestor "${BASE_SHA}" "${COMMIT_SHA}"
            scan_range="${BASE_SHA}..${COMMIT_SHA}"
          fi
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source /repo --log-opts="${scan_range}" --redact --verbose
      - name: Scan working tree with Gitleaks
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source /repo --no-git --redact --verbose

  backend:
    name: Backend tests
    needs: [plan, python-quality, repository-integrity, secret-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit_sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --extra server --extra dev
      - name: Run backend test suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/ci
          uv run --locked python -m pytest -n 4 --dist loadfile --max-worker-restart=0 \
            --cov --cov-report=term --cov-report=xml

  trading-safety:
    name: Trading safety invariants
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit_sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --extra server --extra dev
      - run: uv run --locked python -m pytest -m trading_safety

  frontend:
    name: Frontend checks
    needs: [plan, python-quality, repository-integrity, secret-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit_sha }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm --prefix web run format:check
      - run: npm --prefix web run build
      - run: npm --prefix web run test

  product-smoke:
    name: Product smoke
    needs: [plan, python-quality, repository-integrity, secret-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit_sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked --extra server --extra dev
      - run: npm ci --prefix web
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm --prefix web run build
      - name: Verify research replay and risk workflow
        run: >-
          uv run --locked python -m pytest
          tests/test_profit_discipline_smoke.py
          tests/data/test_dataset_catalog.py::test_publish_reopen_replay_and_availability_cutoff
      - name: Verify runtime review surfaces and fail-closed execution
        run: >-
          npm --prefix web run test:e2e -- safety-surfaces.spec.ts
          --grep 'critical human-review surfaces load from the product runtime|browser-visible execution contracts start fail closed'

  workflow-security:
    name: Workflow security
    needs: [plan, repository-integrity]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit_sha }}
      - name: Scan GitHub Actions with zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false

  promotion-gate:
    name: Promotion Gate
    if: ${{ always() }}
    needs: [plan, python-quality, repository-integrity, secret-scan, backend, trading-safety, frontend, product-smoke, workflow-security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json, os
          results = json.loads(os.environ["RESULTS"])
          if not isinstance(results, dict) or not results:
              raise SystemExit("Promotion check results are missing or invalid")
          failed = sorted(
              name
              for name, job in results.items()
              if not isinstance(job, dict) or job.get("result") != "success"
          )
          if failed:
              raise SystemExit("Promotion checks did not succeed: " + ", ".join(failed))

  # Candidate and release workflows still consume this dispatch context.
  full-ci-gate:
    name: Full CI gate
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: promotion-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require Promotion Gate success
        env:
          PROMOTION_RESULT: ${{ needs.promotion-gate.result }}
        run: test "${PROMOTION_RESULT}" = success
