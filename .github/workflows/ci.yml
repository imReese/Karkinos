name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.11.28"

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  plan:
    name: Verification plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      base_sha: ${{ steps.plan.outputs.base_sha }}
      commit_sha: ${{ steps.plan.outputs.commit_sha }}
      has_backend_changes: ${{ steps.plan.outputs.has_backend_changes }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Build verification plan
        id: plan
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          test "${commit_sha}" = "${GITHUB_SHA}"
          if [[ "${GITHUB_EVENT_NAME}" == pull_request ]]; then
            base_ref="${PR_BASE_SHA}"
          else
            test "${GITHUB_REF}" = refs/heads/dev
            base_ref=origin/main
          fi
          base_sha="$(git rev-parse --verify --end-of-options "${base_ref}^{commit}")"
          git merge-base --is-ancestor "${base_sha}" "${commit_sha}"
          changed_files="$(git diff --name-only "${base_sha}" "${commit_sha}")"
          non_backend_pattern='^(docs/|web/|scripts/|tests/scripts/|[A-Za-z0-9_.-]+\.md$|\.gitignore$)'
          has_backend_changes="false"
          if [[ -n "${changed_files}" ]] && echo "${changed_files}" | grep -qE -v "${non_backend_pattern}"; then
            has_backend_changes="true"
          fi
          {
            echo "base_sha=${base_sha}"
            echo "commit_sha=${commit_sha}"
            echo "has_backend_changes=${has_backend_changes}"
          } >> "${GITHUB_OUTPUT}"

  python-quality:
    name: Python quality
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit_sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Check Python lint and imports
        run: uv run --locked ruff check .
      - name: Check Python formatting
        run: uv run --locked ruff format --check .
      - name: Check Python types
        run: uv run --locked mypy
      - name: Check Python architecture
        run: uv run --locked python tools/check_python_architecture.py
      - name: Check persistence architecture
        run: uv run --locked python tools/check_persistence_architecture.py

  repository-integrity:
    name: Repository integrity
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit_sha }}
      - name: Check public shell entrypoints
        run: |
          set -euo pipefail
          for script in \
            scripts/start_server.sh \
            scripts/stop_server.sh \
            scripts/service/manage_launch_agent.sh \
            scripts/release/bootstrap_installer.sh
          do
            bash -n "${script}"
          done
      - name: Check public shell entrypoints with ShellCheck
        run: |
          set -euo pipefail
          shellcheck \
            scripts/start_server.sh \
            scripts/stop_server.sh \
            scripts/service/manage_launch_agent.sh \
            scripts/release/bootstrap_installer.sh
      - name: Check documentation integrity
        run: python scripts/ci/check_docs_integrity.py
      - name: Check tracked private artifacts
        shell: bash
        run: |
          set -euo pipefail
          forbidden_pattern='(^|/)(\.env$|\.env\.local$|\.env\.production$|.*\.(db|sqlite|sqlite3|duckdb)$|data/store/|logs/|exports/|screenshots/|reports/|\.agents/|skills-lock\.json$)'
          tracked_forbidden="$(git ls-files | grep -E "${forbidden_pattern}" || true)"
          test -z "${tracked_forbidden}"

  secret-scan:
    name: Secret scan
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit_sha }}
          fetch-depth: 0
      - name: Scan new commits with Gitleaks
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          COMMIT_SHA: ${{ needs.plan.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${BASE_SHA}" == 0000000000000000000000000000000000000000 ]]; then
            scan_range="${COMMIT_SHA}"
          else
            git merge-base --is-ancestor "${BASE_SHA}" "${COMMIT_SHA}"
            scan_range="${BASE_SHA}..${COMMIT_SHA}"
          fi
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source /repo --log-opts="${scan_range}" --redact --verbose
      - name: Scan working tree with Gitleaks
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source /repo --no-git --redact --verbose

  backend:
    name: Python tests
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit_sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --extra server --extra dev
      - name: Backend tests
        shell: bash
        env:
          HAS_BACKEND_CHANGES: ${{ needs.plan.outputs.has_backend_changes }}
        run: |
          set -euo pipefail
          mkdir -p reports/ci
          if [[ "${HAS_BACKEND_CHANGES}" == "true" ]]; then
            echo "Core backend changes detected; running full test suite."
            uv run --locked python -m pytest -n 4 --dist loadfile --max-worker-restart=0 \
              -m "not trading_safety and not product_smoke and not database_format" \
              --cov --cov-report= --cov-fail-under=0
          else
            echo "No core backend changes detected; running targeted script tests."
            uv run --locked python -m pytest tests/scripts/ \
              --cov --cov-report= --cov-fail-under=0
          fi
      - name: Database format conformance
        if: ${{ !cancelled() }}
        run: >-
          uv run --locked python -m pytest -m database_format
          --cov --cov-append --cov-report= --cov-fail-under=0
      - name: Trading safety invariants
        if: ${{ !cancelled() }}
        run: >-
          uv run --locked python -m pytest -n 4 --dist loadfile --max-worker-restart=0
          -m trading_safety
          --cov --cov-append --cov-report= --cov-fail-under=0
      - name: Python product smoke
        if: ${{ !cancelled() }}
        env:
          PYTHONUNBUFFERED: "1"
        run: >-
          uv run --locked python -m pytest -n 4 --dist loadfile --max-worker-restart=0
          -m product_smoke -vv
          --durations=20
          --cov --cov-append --cov-report= --cov-fail-under=0
      - name: Check Python coverage
        if: ${{ !cancelled() && needs.plan.outputs.has_backend_changes == 'true' }}
        run: |
          uv run --locked coverage report
          uv run --locked coverage xml

  frontend:
    name: Frontend checks
    needs: [plan, python-quality, repository-integrity, secret-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit_sha }}
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm --prefix web run format:check
      - run: npm --prefix web run build
      - run: npm --prefix web run test

  product-smoke:
    name: Product smoke
    needs: [plan, python-quality, repository-integrity, secret-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit_sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked --extra server --extra dev
      - run: npm ci --prefix web
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm --prefix web run build
      - name: Verify runtime review surfaces and fail-closed execution
        run: >-
          npm --prefix web run test:e2e -- safety-surfaces.spec.ts
          --grep 'critical human-review surfaces load from the product runtime|browser-visible execution contracts start fail closed'

  workflow-security:
    name: Workflow security
    needs: [plan, repository-integrity]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit_sha }}
      - name: Scan GitHub Actions with zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false

  promotion-gate:
    name: Promotion Gate
    if: ${{ always() }}
    needs: [plan, python-quality, repository-integrity, secret-scan, backend, frontend, product-smoke, workflow-security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json, os
          results = json.loads(os.environ["RESULTS"])
          if not isinstance(results, dict) or not results:
              raise SystemExit("Promotion check results are missing or invalid")
          failed = sorted(
              name
              for name, job in results.items()
              if not isinstance(job, dict) or job.get("result") != "success"
          )
          if failed:
              raise SystemExit("Promotion checks did not succeed: " + ", ".join(failed))
