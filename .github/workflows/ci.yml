name: CI

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      pre_promotion:
        type: boolean
        default: false
    outputs:
      verified_sha:
        description: Exact checkout that passed every full verification job
        value: ${{ jobs.code-ci-gate.outputs.verified_sha }}
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact main or dev checkout SHA to validate
        required: true
        type: string
      base_sha:
        description: Previous main SHA for the verified promotion
        required: true
        type: string
  push:
    branches: [main]

permissions:
  contents: read

env:
  UV_VERSION: "0.11.28"
  UV_LOCKED: "true"
  CI_COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}

concurrency:
  group: full-ci-${{ github.workflow }}-${{ inputs.commit_sha || github.sha }}
  cancel-in-progress: false

jobs:
  python-quality:
    name: Python changed-file quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CI_COMMIT_SHA }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Verify exact checkout identity
        env:
          EXPECTED_SHA: ${{ env.CI_COMMIT_SHA }}
          EXPECTED_BASE: ${{ inputs.base_sha || github.event.before }}
          PRE_PROMOTION: ${{ inputs.pre_promotion || false }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/heads/main ]]; then
            test "${GITHUB_EVENT_NAME}" = workflow_dispatch
            test "${GITHUB_REF}" = refs/heads/dev
            test "${PRE_PROMOTION}" = false
          fi
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          if [[ "${PRE_PROMOTION}" != true ]]; then
            test "${GITHUB_SHA}" = "${EXPECTED_SHA}"
          fi
          [[ "${EXPECTED_BASE}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [[ "${EXPECTED_BASE}" != 0000000000000000000000000000000000000000 ]]; then
            git merge-base --is-ancestor "${EXPECTED_BASE}" "${EXPECTED_SHA}"
          fi
      - name: Install quality dependencies
        run: uv sync --extra dev --locked
      - name: Check changed Python files and stable boundaries
        env:
          BASE_SHA: ${{ inputs.base_sha || github.event.before }}
        run: uv run python scripts/ci/check_python_quality.py --base "${BASE_SHA}" --head "${CI_COMMIT_SHA}"

  repository-contracts:
    name: Repository contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CI_COMMIT_SHA }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Install contract dependencies
        run: uv sync --extra server --extra dev --locked
      - name: Run repository contract tests
        run: |
          uv run python -m pytest \
            tests/scripts/test_docs_health.py \
            tests/strategy/test_strategy_docs.py \
            tests/scripts/test_ci_preflight.py \
            tests/scripts/test_full_ci_contract.py \
            tests/scripts/test_classify_dev_changes.py \
            tests/test_ci_workflow.py \
            tests/test_ci_safety_workflow.py \
            tests/test_ci_change_aware.py \
            tests/test_docker_deployment_contract.py \
            tests/scripts/test_scripts_inventory.py \
            tests/tools/test_main_promotion.py \
            tests/scripts/test_main_source_runtime.py \
            tests/test_verify_release_source_ci.py

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CI_COMMIT_SHA }}
      - name: Check public shell entrypoint syntax
        run: bash -n scripts/start_server.sh scripts/stop_server.sh scripts/service/manage_launch_agent.sh scripts/release/bootstrap_installer.sh
      - name: Check documentation health
        run: python scripts/ci/check_docs_health.py
      - name: Check tracked private artifacts
        shell: bash
        run: |
          set -euo pipefail
          forbidden_pattern='(^|/)(\.env$|\.env\.local$|\.env\.production$|.*\.(db|sqlite|duckdb)$|data/store/|logs/|exports/|screenshots/|reports/|\.agents/|skills-lock\.json$)'
          tracked_forbidden="$(git ls-files | grep -E "${forbidden_pattern}" || true)"
          test -z "${tracked_forbidden}"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CI_COMMIT_SHA }}
          fetch-depth: 0
      - name: Scan git history with Gitleaks
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source /repo --redact --verbose
      - name: Scan working tree with Gitleaks
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source /repo --no-git --redact --verbose

  backend:
    name: Backend tests
    needs: [python-quality, repository-contracts, hygiene, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CI_COMMIT_SHA }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --extra server --extra dev --locked
      - name: Run server route tests
        run: uv run python -m pytest tests/test_server_routes.py
      - name: Run deterministic Profit Discipline smoke path
        run: uv run python -m pytest tests/test_profit_discipline_smoke.py
      - name: Run backend test suite
        run: |
          mkdir -p reports/ci
          uv run python -m pytest -n 4 --dist loadfile --max-worker-restart=0 \
            --cov --cov-report=term --cov-report=xml \
            --junitxml=reports/ci/backend-junit.xml
      - name: Upload backend test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-evidence
          path: |
            reports/ci/backend-junit.xml
            reports/ci/coverage.xml
          if-no-files-found: error

  frontend:
    name: Frontend checks
    needs: [python-quality, repository-contracts, hygiene, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CI_COMMIT_SHA }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm --prefix web run format:check
      - run: npm --prefix web run build
      - name: Run frontend tests
        run: |
          mkdir -p reports/ci
          npm --prefix web run test -- --reporter=junit --outputFile=../reports/ci/frontend-junit.xml
      - name: Upload frontend test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-test-evidence
          path: reports/ci/frontend-junit.xml
          if-no-files-found: error

  trading-safety:
    name: Trading safety invariants
    needs: [python-quality, repository-contracts, hygiene, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CI_COMMIT_SHA }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --extra server --extra dev --locked
      - run: uv run python -m pytest -m trading_safety

  dependency-audit:
    name: Production dependency audit
    needs: [python-quality, repository-contracts, hygiene, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CI_COMMIT_SHA }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --extra server --extra dev --locked
      - run: uv export --locked --extra server --no-dev --no-emit-project --no-hashes --output-file "${RUNNER_TEMP}/requirements.txt"
      - run: uv run --extra dev pip-audit --requirement "${RUNNER_TEMP}/requirements.txt" --progress-spinner=off
      - name: Audit npm production dependencies
        run: npm --prefix web audit --omit=dev --audit-level=moderate

  docker-runtime:
    name: Docker runtime smoke
    needs: [python-quality, repository-contracts, hygiene, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CI_COMMIT_SHA }}
      - name: Build locked runtime image
        run: docker build --tag karkinos:ci .
      - name: Start runtime with fail-closed defaults
        run: |
          printf '{}\n' > "${RUNNER_TEMP}/karkinos-config.json"
          docker volume create karkinos-ci-data
          docker run --detach --name karkinos-ci \
            --publish 127.0.0.1:8000:8000 \
            --volume "karkinos-ci-data:/app/data/store" \
            --volume "${RUNNER_TEMP}/karkinos-config.json:/app/config.json:ro" \
            karkinos:ci
      - name: Verify non-root fail-closed runtime
        run: python scripts/ci/verify_docker_runtime.py --timeout-seconds 90
      - name: Diagnose failed runtime
        if: failure()
        run: |
          docker inspect karkinos-ci || true
          docker logs karkinos-ci || true
      - name: Stop runtime
        if: always()
        run: |
          docker rm --force karkinos-ci || true
          docker volume rm karkinos-ci-data || true

  browser-safety:
    name: Browser safety smoke
    needs: [python-quality, repository-contracts, hygiene, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CI_COMMIT_SHA }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --extra server --extra dev --locked
      - run: npm ci --prefix web
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm --prefix web run build
      - run: npm --prefix web run test:e2e

  repository-acceptance-audit:
    name: Repository acceptance audit
    needs: [backend, frontend, trading-safety]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CI_COMMIT_SHA }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --extra server --extra dev --locked
      - name: Download backend test evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-test-evidence
          path: reports/ci
      - name: Download frontend test evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-test-evidence
          path: reports/ci
      - name: Run repository acceptance audit report
        run: |
          uv run python scripts/ci/export_acceptance_audit.py --audit all \
            --verify-evidence \
            --backend-junit reports/ci/backend-junit.xml \
            --frontend-junit reports/ci/frontend-junit.xml \
            --pretty \
            --output reports/ci/acceptance-audit.json

  code-ci-gate:
    name: Code CI gate
    if: always()
    needs:
      - python-quality
      - repository-contracts
      - hygiene
      - secret-scan
      - backend
      - frontend
      - trading-safety
      - dependency-audit
      - docker-runtime
      - browser-safety
      - repository-acceptance-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verified_sha: ${{ steps.gate.outputs.verified_sha }}
    steps:
      - name: Require every main CI check to pass
        id: gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = [name for name, job in results.items() if not isinstance(job, dict) or job.get("result") != "success"]
          if failed:
              raise SystemExit("Main CI checks did not succeed: " + ", ".join(sorted(failed)))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("verified_sha=" + os.environ["CI_COMMIT_SHA"] + "\n")
