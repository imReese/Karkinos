name: CI

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact main/dev checkout SHA to validate
        required: true
        type: string
      base_sha:
        description: Base SHA used to validate ancestry and changed-file quality
        required: true
        type: string
  push:
    branches: [main]

permissions:
  contents: read

env:
  UV_VERSION: "0.11.28"
  CI_COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
  CI_BASE_SHA: ${{ inputs.base_sha || github.event.before }}

concurrency:
  group: full-ci-${{ github.workflow }}-${{ inputs.commit_sha || github.sha }}
  cancel-in-progress: false

jobs:
  verify-source:
    name: Verify exact source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CI_COMMIT_SHA }}
          fetch-depth: 0
      - name: Verify checkout identity and ancestry
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="${CI_COMMIT_SHA}"
          base_sha="${CI_BASE_SHA}"
          [[ "${expected_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${base_sha}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${expected_sha}"
          case "${GITHUB_REF}" in
            refs/heads/main|refs/heads/dev) ;;
            *) echo "Full CI must run from main or dev." >&2; exit 1 ;;
          esac
          test "${GITHUB_SHA}" = "${expected_sha}"
          if [[ "${base_sha}" != 0000000000000000000000000000000000000000 ]]; then
            git merge-base --is-ancestor "${base_sha}" "${expected_sha}"
          fi

  python-quality:
    name: Python changed-file quality
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CI_COMMIT_SHA }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --extra dev
      - name: Check Python quality and stable boundaries
        run: uv run --locked python scripts/ci/check_python_quality.py --base "${CI_BASE_SHA}" --head "${CI_COMMIT_SHA}"

  repository-integrity:
    name: Repository integrity
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CI_COMMIT_SHA }}
      - name: Check public shell entrypoint syntax
        run: bash -n scripts/start_server.sh scripts/stop_server.sh scripts/service/manage_launch_agent.sh scripts/release/bootstrap_installer.sh
      - name: Check documentation integrity
        run: python scripts/ci/check_docs_integrity.py
      - name: Check tracked private artifacts
        shell: bash
        run: |
          set -euo pipefail
          forbidden_pattern='(^|/)(\.env$|\.env\.local$|\.env\.production$|.*\.(db|sqlite|sqlite3|duckdb)$|data/store/|logs/|exports/|screenshots/|reports/|\.agents/|skills-lock\.json$)'
          tracked_forbidden="$(git ls-files | grep -E "${forbidden_pattern}" || true)"
          test -z "${tracked_forbidden}"

  secret-scan:
    name: Secret scan
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CI_COMMIT_SHA }}
          fetch-depth: 0
      - name: Scan git history with Gitleaks
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source /repo --redact --verbose
      - name: Scan working tree with Gitleaks
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source /repo --no-git --redact --verbose

  backend:
    name: Backend tests
    needs: [verify-source, python-quality, repository-integrity, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CI_COMMIT_SHA }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --extra server --extra dev
      - name: Run backend test suite
        run: uv run --locked python -m pytest -n 4 --dist loadfile --max-worker-restart=0 -m "not acceptance and not trading_safety"

  trading-safety:
    name: Trading safety invariants
    needs: [verify-source, python-quality, repository-integrity, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CI_COMMIT_SHA }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --extra server --extra dev
      - run: uv run --locked python -m pytest -m trading_safety

  frontend:
    name: Frontend checks
    needs: [verify-source, repository-integrity, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CI_COMMIT_SHA }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm --prefix web run format:check
      - run: npm --prefix web run build
      - run: npm --prefix web run test

  dependency-audit:
    name: Production dependency audit
    needs: [verify-source, repository-integrity, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CI_COMMIT_SHA }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --extra server --extra dev
      - run: uv export --locked --extra server --no-dev --no-emit-project --no-hashes --output-file "${RUNNER_TEMP}/requirements.txt"
      - run: uv run --locked --extra dev pip-audit --requirement "${RUNNER_TEMP}/requirements.txt" --progress-spinner=off
      - run: npm --prefix web audit --omit=dev --audit-level=moderate

  docker-runtime:
    name: Docker runtime smoke
    needs: [verify-source, python-quality, repository-integrity, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CI_COMMIT_SHA }}
      - name: Build locked runtime image
        run: docker build --tag karkinos:ci .
      - name: Start runtime with fail-closed defaults
        run: |
          printf '{}\n' > "${RUNNER_TEMP}/karkinos-config.json"
          docker volume create karkinos-ci-data
          docker run --detach --name karkinos-ci \
            --publish 127.0.0.1:8000:8000 \
            --volume "karkinos-ci-data:/app/data/store" \
            --volume "${RUNNER_TEMP}/karkinos-config.json:/app/config.json:ro" \
            karkinos:ci
      - name: Verify non-root fail-closed runtime
        run: python scripts/ci/verify_docker_runtime.py --timeout-seconds 90
      - name: Diagnose failed runtime
        if: failure()
        run: |
          docker inspect karkinos-ci || true
          docker logs karkinos-ci || true
      - name: Stop runtime
        if: always()
        run: |
          docker rm --force karkinos-ci || true
          docker volume rm karkinos-ci-data || true

  browser-safety:
    name: Browser safety smoke
    needs: [verify-source, python-quality, repository-integrity, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CI_COMMIT_SHA }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --extra server --extra dev
      - run: npm ci --prefix web
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm --prefix web run build
      - run: npm --prefix web run test:e2e

  code-ci-gate:
    name: Code CI gate
    if: always()
    needs: [verify-source, python-quality, repository-integrity, secret-scan, backend, trading-safety, frontend, dependency-audit, docker-runtime, browser-safety]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require full verification success
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = sorted(name for name, job in results.items() if not isinstance(job, dict) or job.get("result") != "success")
          if failed:
              raise SystemExit("Full CI checks did not succeed: " + ", ".join(failed))
