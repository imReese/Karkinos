name: One-shot stale readiness assertion cleanup

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/one-shot-remove-stale-readiness-assertion.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.repository == 'imReese/Karkinos' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact dev head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Remove retired governance assertion
        shell: python
        run: |
          from pathlib import Path

          path = Path('web/src/features/backtest/components/backtest-page.test.tsx')
          text = path.read_text(encoding='utf-8')
          stale = """  expect(\n    await screen.findByText(\n      'Product-readiness proof only; it does not enable broker execution or investment advice.',\n    ),\n  ).toBeTruthy();\n"""
          count = text.count(stale)
          if count != 1:
              raise SystemExit(f'expected exactly one stale assertion, got {count}')
          path.write_text(text.replace(stale, '', 1), encoding='utf-8')
      - name: Verify focused frontend test and format
        run: |
          npm ci --prefix web
          npm --prefix web run format:check
          cd web
          npx vitest run --config vitest.config.ts src/features/backtest/components/backtest-page.test.tsx
      - name: Commit cleanup and remove one-shot workflow
        run: |
          set -euo pipefail
          rm -- .github/workflows/one-shot-remove-stale-readiness-assertion.yml
          git config user.name "Reese"
          git config user.email "63846933+imReese@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "test: drop retired readiness copy assertion"
          git push origin HEAD:dev
