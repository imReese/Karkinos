name: Source evidence

on:
  push:
    branches: [main, dev]
    paths: [.github/workflows/source-evidence.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Export isolated verification dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Export locked backend verification environment
        run: |
          set -euo pipefail
          python -m pip install uv==0.11.28
          uv python install 3.12.13
          uv sync --managed-python --python 3.12.13 --extra server --extra dev --frozen
          mkdir -p "${RUNNER_TEMP}/verification"
          git archive --format=tar HEAD | gzip > "${RUNNER_TEMP}/verification/source.tar.gz"
          python_root="$(dirname "$(dirname "$(uv python find --managed-python 3.12.13)")")"
          tar -C "${python_root}" -czf "${RUNNER_TEMP}/verification/python.tar.gz" .
          tar -czf "${RUNNER_TEMP}/verification/venv.tar.gz" .venv
          git rev-parse HEAD > "${RUNNER_TEMP}/verification/COMMIT"
          cd "${RUNNER_TEMP}/verification"
          sha256sum source.tar.gz python.tar.gz venv.tar.gz > SHA256SUMS

      - name: Upload verification dependencies
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-source-verification
          path: ${{ runner.temp }}/verification/
          if-no-files-found: error
          retention-days: 1
