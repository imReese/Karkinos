name: Source evidence

on:
  push:
    branches: [main]
    paths: [.github/workflows/source-evidence.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Export isolated verification dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"

      - name: Download locked frontend dependencies
        run: |
          npm ci --prefix web --ignore-scripts
          mkdir -p "${RUNNER_TEMP}/verification"
          tar -C web -czf "${RUNNER_TEMP}/verification/node_modules.tar.gz" node_modules
          cd "${RUNNER_TEMP}/verification"
          sha256sum node_modules.tar.gz > SHA256SUMS

      - name: Download provider module for offline tests
        run: |
          python -m pip download --no-deps --only-binary=:all: --dest "${RUNNER_TEMP}/verification" akshare

      - name: Upload verification dependencies
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-frontend-provider-dependencies
          path: ${{ runner.temp }}/verification/
          if-no-files-found: error
          retention-days: 1
