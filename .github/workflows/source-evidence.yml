name: Source evidence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Export exact tracked source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Archive tracked files only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          mkdir -p "${RUNNER_TEMP}/source-evidence"
          git archive --format=tar HEAD | gzip -n > "${RUNNER_TEMP}/source-evidence/source.tar.gz"
          git rev-parse HEAD > "${RUNNER_TEMP}/source-evidence/commit.txt"
          cd "${RUNNER_TEMP}/source-evidence"
          sha256sum source.tar.gz > SHA256SUMS

      - name: Upload source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-${{ github.sha }}
          path: ${{ runner.temp }}/source-evidence/
          if-no-files-found: error
          retention-days: 7
