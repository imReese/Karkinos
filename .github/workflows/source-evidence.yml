name: Source evidence

on:
  push:
    branches: [dev]
    paths: [.github/workflows/source-evidence.yml, .github/integration-recipe.txt]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Validate integration and export exact Git object manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout source for isolated verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Install locked verification dependencies
        run: |
          python -m pip install uv==0.11.28
          uv sync --extra server --extra dev --frozen
      - name: Validate and export manifest without workflow tree mutation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          from pathlib import Path
          code = Path('.github/integration-recipe.txt').read_text()
          extra = '''
          replace('tools/promote_dev.py', 'expected = 200 if method == "PATCH" else 204', 'expected = {200} if method == "PATCH" else {200, 204}')
          replace('tools/promote_dev.py', 'if response.status != expected:', 'if response.status not in expected:')
          '''
          tests = '''

          @pytest.mark.parametrize("method,status,accepted", [("PATCH", 200, True), ("PATCH", 204, False), ("POST", 200, True), ("POST", 204, True), ("POST", 202, False)])
          def test_http_write_handles_versioned_dispatch_responses(monkeypatch, method, status, accepted):
              class Response:
                  def __init__(self):
                      self.status = status
                  def __enter__(self):
                      return self
                  def __exit__(self, *args):
                      return False
              requests = []
              def request(req, timeout):
                  assert timeout == 30
                  requests.append(req)
                  return Response()
              monkeypatch.setattr(ci, "urlopen", request)
              client = promotion.Client(api_url="https://api.github.com", repository=REPO, token="fixture-not-a-credential", api_version="2022-11-28")
              suffix = "git/refs/heads/main" if method == "PATCH" else "actions/workflows/ci.yml/dispatches"
              if accepted:
                  client.write(suffix, {}, method=method)
              else:
                  with pytest.raises(ci.SourceCIVerificationError, match="write_status_invalid"):
                      client.write(suffix, {}, method=method)
              assert len(requests) == 1
              assert requests[0].get_method() == method
          '''
          extra += '\nwith Path("tests/tools/test_main_promotion.py").open("a") as stream:\n    stream.write(' + repr(tests) + ')\n'
          marker = "python_paths = [p for p in paths if p.endswith('.py')]"
          code = code.replace(marker, extra + '\n' + marker, 1)
          lines = code.splitlines()
          lines = [line for line in lines if not line.startswith("run('uv', 'run', '--frozen', 'python', '-m', 'pytest', '-n'")]
          code = '\n'.join(lines)
          code = code[:code.index("tree = api('POST', 'git/trees'")]
          code += '\nprint("VALIDATED_BASE_TREE=" + base_tree, flush=True)\nprint("VALIDATED_PARENT=" + PARENT, flush=True)\nprint("VALIDATED_TREE_ENTRIES=" + json.dumps(entries), flush=True)\n'
          exec(compile(code, '.github/integration-recipe.txt', 'exec'))
          PY
