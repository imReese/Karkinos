name: Source evidence

on:
  push:
    branches: [dev]
    paths: [.github/workflows/source-evidence.yml, .github/integration-recipe.txt]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Validate integration and prepare immutable commit object
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout source for isolated verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Install locked verification dependencies
        run: |
          python -m pip install uv==0.11.28
          uv sync --extra server --extra dev --frozen
      - name: Prepare and fully validate proposed integration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/integration-recipe.txt
      - name: Upload integration test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-validation
          path: reports/ci/integration-validation.xml
          if-no-files-found: warn
          retention-days: 7
