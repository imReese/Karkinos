name: Dev CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read

env:
  UV_VERSION: "0.11.28"

concurrency:
  group: dev-ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: Dev change classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base_sha: ${{ steps.classify.outputs.base_sha }}
      backend: ${{ steps.classify.outputs.backend }}
      backend_tests: ${{ steps.classify.outputs.backend_tests }}
      frontend: ${{ steps.classify.outputs.frontend }}
      trading: ${{ steps.classify.outputs.trading }}
      dependencies: ${{ steps.classify.outputs.dependencies }}
      docker: ${{ steps.classify.outputs.docker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          python scripts/ci/classify_dev_changes.py \
            --base "${BASE_SHA}" --head "${GITHUB_SHA}" \
            --github-output "${GITHUB_OUTPUT}"

  python-quality:
    name: Python changed-file quality
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Install quality dependencies
        run: uv sync --locked --extra dev
      - name: Check changed Python files and stable boundaries
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
        run: uv run --locked python scripts/ci/check_python_quality.py --base "${BASE_SHA}" --head "${GITHUB_SHA}"

  repository-contracts:
    name: Repository contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Install contract dependencies
        run: uv sync --locked --extra server --extra dev
      - name: Run repository contract tests
        run: |
          uv run --locked python -m pytest \
            tests/scripts/test_docs_health.py \
            tests/strategy/test_strategy_docs.py \
            tests/scripts/test_ci_preflight.py \
            tests/scripts/test_full_ci_contract.py \
            tests/test_ci_workflow.py \
            tests/test_ci_safety_workflow.py \
            tests/test_ci_change_aware.py \
            tests/scripts/test_classify_dev_changes.py \
            tests/test_docker_deployment_contract.py \
            tests/scripts/test_scripts_inventory.py \
            tests/tools/test_main_promotion.py \
            tests/tools/test_ci_reuse.py \
            tests/scripts/test_main_source_runtime.py \
            tests/test_verify_release_source_ci.py

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell entrypoints
        run: bash -n scripts/start_server.sh scripts/stop_server.sh scripts/service/manage_launch_agent.sh scripts/release/bootstrap_installer.sh
      - name: Check documentation health
        run: python scripts/ci/check_docs_health.py

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan working tree with Gitleaks
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source /repo --no-git --redact --verbose

  backend:
    name: Backend changed-scope tests
    if: ${{ needs.changes.outputs.backend == 'true' }}
    needs: [changes, python-quality, repository-contracts, hygiene, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --extra server --extra dev
      - name: Run selected backend tests
        env:
          BACKEND_TESTS: ${{ needs.changes.outputs.backend_tests }}
        shell: python
        run: |
          import json, os, subprocess
          selectors = json.loads(os.environ["BACKEND_TESTS"])
          if not isinstance(selectors, list) or not selectors or not all(isinstance(path, str) and (path == "tests" or path.startswith("tests/")) for path in selectors):
              raise SystemExit("Invalid backend test scope")
          subprocess.run(["uv", "run", "--locked", "python", "-m", "pytest", "-n", "4", "--dist", "loadfile", "--max-worker-restart=0", "--", *selectors], check=True)

  frontend:
    name: Frontend changed-scope checks
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    needs: [changes, python-quality, repository-contracts, hygiene, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm --prefix web run format:check
      - run: npm --prefix web run build
      - run: npm --prefix web run test

  trading-safety:
    name: Trading safety changed-scope checks
    if: ${{ needs.changes.outputs.trading == 'true' }}
    needs: [changes, python-quality, repository-contracts, hygiene, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --extra server --extra dev
      - run: uv run --locked python -m pytest -m trading_safety

  dependency-audit:
    name: Dependency changed-scope audit
    if: ${{ needs.changes.outputs.dependencies == 'true' }}
    needs: [changes, python-quality, repository-contracts, hygiene, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --extra server --extra dev
      - run: uv export --locked --extra server --no-dev --no-emit-project --no-hashes --output-file "${RUNNER_TEMP}/requirements.txt"
      - run: uv run --locked --extra dev pip-audit --requirement "${RUNNER_TEMP}/requirements.txt" --progress-spinner=off
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
      - name: Audit npm production dependencies
        run: npm --prefix web audit --omit=dev --audit-level=moderate

  docker-runtime:
    name: Docker runtime changed-scope smoke
    if: ${{ needs.changes.outputs.docker == 'true' }}
    needs: [changes, python-quality, repository-contracts, hygiene, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build locked runtime image
        run: docker build --tag karkinos:ci .
      - name: Start runtime with fail-closed defaults
        run: |
          printf '{}\n' > "${RUNNER_TEMP}/karkinos-config.json"
          docker volume create karkinos-ci-data
          docker run --detach --name karkinos-ci \
            --publish 127.0.0.1:8000:8000 \
            --volume "karkinos-ci-data:/app/data/store" \
            --volume "${RUNNER_TEMP}/karkinos-config.json:/app/config.json:ro" \
            karkinos:ci
      - name: Verify non-root fail-closed runtime
        run: python scripts/ci/verify_docker_runtime.py --timeout-seconds 90
      - name: Diagnose failed runtime
        if: failure()
        run: |
          docker inspect karkinos-ci || true
          docker logs karkinos-ci || true
      - name: Stop runtime
        if: always()
        run: |
          docker rm --force karkinos-ci || true
          docker volume rm karkinos-ci-data || true

  code-ci-gate:
    name: Dev CI gate
    if: always()
    needs: [changes, python-quality, repository-contracts, hygiene, secret-scan, backend, frontend, trading-safety, dependency-audit, docker-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require scheduled dev checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json, os
          results = json.loads(os.environ["RESULTS"])
          optional = {"backend": "backend", "frontend": "frontend", "trading-safety": "trading", "dependency-audit": "dependencies", "docker-runtime": "docker"}
          scope = results.get("changes", {}).get("outputs", {})
          failed = []
          for name, job in results.items():
              result = job.get("result") if isinstance(job, dict) else None
              selected = scope.get(optional[name]) if name in optional else "true"
              expected = {"true": "success", "false": "skipped"}.get(selected)
              if expected is None or result != expected:
                  failed.append(name)
          if failed:
              raise SystemExit("Dev CI checks did not succeed: " + ", ".join(sorted(failed)))
