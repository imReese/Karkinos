name: Release Candidate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character main commit SHA to build
        required: true
        type: string

permissions:
  contents: read

env:
  UV_VERSION: "0.11.28"

concurrency:
  group: release-candidate-${{ github.repository }}-${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
  cancel-in-progress: false

jobs:
  source:
    name: Verify candidate source
    if: ${{ github.event.repository.fork == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
      version: ${{ steps.version.outputs.version }}
      source_ci_run_id: ${{ steps.source_ci.outputs.source_ci_run_id }}
      source_ci_run_attempt: ${{ steps.source_ci.outputs.source_ci_run_attempt }}
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify full commit identity
        id: identity
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_COMMIT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "${TARGET_COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git -c "http.extraheader=AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch \
            --force --no-tags origin refs/heads/main:refs/remotes/origin/main
          git checkout --detach "${TARGET_COMMIT_SHA}"
          commit_sha="$(git rev-parse HEAD)"
          [[ "${commit_sha}" =~ ^[0-9a-f]{40}$ ]]
          test "${commit_sha}" = "${TARGET_COMMIT_SHA}"
          git merge-base --is-ancestor "${commit_sha}" refs/remotes/origin/main
          echo "commit_sha=${commit_sha}" >> "${GITHUB_OUTPUT}"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify exact main Code CI evidence
        id: source_ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_COMMIT_SHA: ${{ steps.identity.outputs.commit_sha }}
        run: |
          set -euo pipefail
          verify_args=(
            --repository "${GITHUB_REPOSITORY}"
            --commit-sha "${TARGET_COMMIT_SHA}"
            --required-job "Code CI gate"
            --required-job "Repository acceptance audit"
            --timeout-seconds 1200
            --poll-interval-seconds 15
          )
          python tools/verify_release_source_ci.py "${verify_args[@]}" \
            --github-output "${GITHUB_OUTPUT}"
      - name: Read package version
        id: version
        run: |
          set -euo pipefail
          version="$(python -c 'import re; print(re.search(r"__version__\s*=\s*\"([^\"]+)", open("server/__init__.py").read()).group(1))')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  native:
    name: Build macOS candidate (${{ matrix.architecture }})
    if: ${{ github.event.repository.fork == false }}
    needs: source
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - architecture: arm64
            runner: macos-14
          - architecture: x86_64
            runner: macos-15-intel
    permissions:
      contents: read
    steps:
      - name: Checkout verified candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit_sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked build tools
        run: |
          python -m pip install "uv==${UV_VERSION}"
          npm ci --prefix web
      - name: Build frontend bundle
        run: npm --prefix web run build
      - name: Build self-contained native candidate
        env:
          CANDIDATE_COMMIT_SHA: ${{ needs.source.outputs.commit_sha }}
          CANDIDATE_VERSION: ${{ needs.source.outputs.version }}
          CANDIDATE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          mkdir -p candidate
          python tools/build_macos_candidate.py \
            --commit-sha "${CANDIDATE_COMMIT_SHA}" \
            --version "${CANDIDATE_VERSION}" \
            --architecture "${CANDIDATE_ARCHITECTURE}" \
            --output "candidate/karkinos-${CANDIDATE_VERSION}-macos-${CANDIDATE_ARCHITECTURE}.tar.gz"
      - name: Upload native candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.architecture }}-${{ needs.source.outputs.commit_sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 30

  image:
    name: Build candidate container image
    if: ${{ github.event.repository.fork == false }}
    needs: source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      reference: ${{ steps.reference.outputs.reference }}
    steps:
      - name: Checkout verified candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit_sha }}
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute candidate image reference
        id: reference
        env:
          CANDIDATE_COMMIT_SHA: ${{ needs.source.outputs.commit_sha }}
        run: |
          set -euo pipefail
          printf 'reference=ghcr.io/%s:candidate-sha-%s\n' \
            "${GITHUB_REPOSITORY,,}" "${CANDIDATE_COMMIT_SHA}" >> "${GITHUB_OUTPUT}"
      - name: Reject a reused candidate image tag
        env:
          CANDIDATE_IMAGE_REFERENCE: ${{ steps.reference.outputs.reference }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect --raw "${CANDIDATE_IMAGE_REFERENCE}" >/dev/null 2>&1; then
            echo "candidate image tag already exists" >&2
            exit 1
          fi
      # This candidate build is intentionally the only source build. Stable promotion uses its digest.
      - name: Build and push candidate multi-architecture image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.reference.outputs.reference }}
          build-args: VERSION=${{ needs.source.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.source.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.source.outputs.commit_sha }}
      - name: Verify candidate image metadata
        env:
          EXPECTED_VERSION: ${{ needs.source.outputs.version }}
          EXPECTED_REVISION: ${{ needs.source.outputs.commit_sha }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REFERENCE: ${{ steps.reference.outputs.reference }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE_REFERENCE}"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${IMAGE_REFERENCE}")" = "${EXPECTED_VERSION}"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${IMAGE_REFERENCE}")" = "${EXPECTED_REVISION}"
          actual_digest="$(docker buildx imagetools inspect "${IMAGE_REFERENCE}" | awk '/^Digest:/ {print $2; exit}')"
          test "${actual_digest}" = "${EXPECTED_DIGEST}"

  manifest:
    name: Persist candidate manifest
    if: ${{ github.event.repository.fork == false }}
    needs: [source, native, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout verified candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit_sha }}
          persist-credentials: false
      - name: Download native candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*-*
          path: candidate-artifacts
          merge-multiple: true
      - name: Build candidate manifest
        env:
          CANDIDATE_COMMIT_SHA: ${{ needs.source.outputs.commit_sha }}
          CANDIDATE_VERSION: ${{ needs.source.outputs.version }}
          SOURCE_CI_RUN_ID: ${{ needs.source.outputs.source_ci_run_id }}
          SOURCE_CI_RUN_ATTEMPT: ${{ needs.source.outputs.source_ci_run_attempt }}
          CANDIDATE_IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          python tools/release_candidate.py build \
            --repo-root . \
            --artifact-dir candidate-artifacts \
            --commit-sha "${CANDIDATE_COMMIT_SHA}" \
            --version "${CANDIDATE_VERSION}" \
            --source-ci-run-id "${SOURCE_CI_RUN_ID}" \
            --source-ci-run-attempt "${SOURCE_CI_RUN_ATTEMPT}" \
            --image-reference "ghcr.io/${GITHUB_REPOSITORY,,}" \
            --image-digest "${CANDIDATE_IMAGE_DIGEST}" \
            --output candidate-manifest.json
      - name: Upload immutable candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: karkinos-candidate-${{ needs.source.outputs.commit_sha }}
          path: |
            candidate-manifest.json
            candidate-artifacts/
          if-no-files-found: error
          retention-days: 30
