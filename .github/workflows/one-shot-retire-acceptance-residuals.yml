name: One-shot acceptance residual cleanup

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/one-shot-retire-acceptance-residuals.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.repository == 'imReese/Karkinos' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact dev head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: dev
          persist-credentials: true
      - name: Apply bounded cleanup migration
        run: python tools/retire_acceptance_residuals.py
      - name: Commit cleanup and remove one-shot migration files
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; paths=[Path("server/services/operations_today_subsystems.py"), Path("web/src/features/backtest/api-governance-contracts.ts")]; [p.write_text(p.read_text(encoding="utf-8").rstrip()+"\n", encoding="utf-8") for p in paths]'
          rm -- tools/retire_acceptance_residuals.py
          rm -- .github/workflows/one-shot-retire-acceptance-residuals.yml
          git config user.name "Reese"
          git config user.email "63846933+imReese@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "refactor: finish milestone audit retirement"
          git push origin HEAD:dev
