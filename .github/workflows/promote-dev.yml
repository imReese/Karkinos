name: Promote verified dev

on:
  schedule:
    # Daily at 02:17 Asia/Shanghai. Avoid the top of the hour because scheduled
    # Actions can be delayed under high load.
    - cron: "17 2 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote-dev-to-main
  queue: max

jobs:
  select:
    name: Select exact green dev head
    if: ${{ github.repository == 'imReese/Karkinos' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      has_candidate: ${{ steps.selection.outputs.has_candidate }}
      previous_main: ${{ steps.selection.outputs.previous_main }}
      observed_dev: ${{ steps.selection.outputs.observed_dev }}
      commit_sha: ${{ steps.selection.outputs.commit_sha }}
      run_id: ${{ steps.selection.outputs.run_id }}
      run_attempt: ${{ steps.selection.outputs.run_attempt }}
    steps:
      - name: Checkout trusted main automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Select exact successful dev head
        id: selection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.promote_dev > "${RUNNER_TEMP}/promotion-selection.json"
          cat "${RUNNER_TEMP}/promotion-selection.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "promotion-selection.json").read_text()
          )
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              if payload.get("result") == "no_eligible_new_commit":
                  stream.write("has_candidate=false\n")
              else:
                  stream.write("has_candidate=true\n")
                  for key in (
                      "previous_main",
                      "observed_dev",
                      "commit_sha",
                      "run_id",
                      "run_attempt",
                  ):
                      stream.write(f"{key}={payload[key]}\n")
          PY

  promote:
    name: Fast-forward exact green dev head
    if: ${{ needs.select.outputs.has_candidate == 'true' && github.repository == 'imReese/Karkinos' && github.ref == 'refs/heads/main' }}
    needs: [select]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      statuses: write
    steps:
      - name: Checkout trusted main automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Revalidate exact Dev CI evidence and fast-forward main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_MAIN: ${{ needs.select.outputs.previous_main }}
          OBSERVED_DEV: ${{ needs.select.outputs.observed_dev }}
          COMMIT_SHA: ${{ needs.select.outputs.commit_sha }}
          DEV_CI_RUN_ID: ${{ needs.select.outputs.run_id }}
          DEV_CI_RUN_ATTEMPT: ${{ needs.select.outputs.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os

          from tools import promote_dev as promotion

          selection = promotion.Selection(
              previous_main=os.environ["PREVIOUS_MAIN"],
              observed_dev=os.environ["OBSERVED_DEV"],
              commit_sha=os.environ["COMMIT_SHA"],
              run_id=int(os.environ["DEV_CI_RUN_ID"]),
              run_attempt=int(os.environ["DEV_CI_RUN_ATTEMPT"]),
          )
          client = promotion.Client(
              api_url="https://api.github.com",
              repository=os.environ["GITHUB_REPOSITORY"],
              token=os.environ["GITHUB_TOKEN"],
              api_version="2022-11-28",
          )
          result = promotion.apply(
              client,
              os.environ["GITHUB_REPOSITORY"],
              selection,
          )
          print(json.dumps(result, sort_keys=True, indent=2))
          PY

  repair-followup:
    name: Repair missing post-promotion dispatches
    if: ${{ needs.select.outputs.has_candidate == 'false' && github.repository == 'imReese/Karkinos' && github.ref == 'refs/heads/main' }}
    needs: [select]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout trusted main automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Repair only missing exact-main runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m tools.promote_dev --repair-followup
