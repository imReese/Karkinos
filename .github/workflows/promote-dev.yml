name: Promote verified dev

on:
  schedule:
    # Every day at 03:17 Asia/Tokyo (18:17 UTC); not an exact-time SLA.
    - cron: "17 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/promote-dev.yml]

permissions:
  contents: read

concurrency:
  group: promote-dev-to-main
  cancel-in-progress: false

jobs:
  promote:
    name: Fast-forward verified dev commit
    if: ${{ github.repository == 'imReese/Karkinos' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout trusted main automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Verify exact dev evidence and fast-forward main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m tools.promote_dev --apply
