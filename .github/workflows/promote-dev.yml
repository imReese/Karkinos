name: Promote verified dev

on: # zizmor: ignore[dangerous-triggers] privileged controller executes only trusted main and verifies the exact dev gate through the API
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote-dev-to-main
  cancel-in-progress: false

jobs:
  promote:
    name: Fast-forward current green dev
    if: >-
      ${{
        github.repository == 'imReese/Karkinos' &&
        github.ref == 'refs/heads/main' &&
        (
          github.event_name == 'workflow_dispatch' ||
          (
            github.event.workflow_run.head_branch == 'dev' &&
            github.event.workflow_run.event == 'push'
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - name: Checkout trusted main controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Verify gate and fast-forward main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/promote_dev.py --apply
