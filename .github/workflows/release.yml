name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify_main_code_ci:
    name: Verify exact main Code CI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    outputs:
      commit_sha: ${{ steps.source.outputs.commit_sha }}
      tag_object_sha: ${{ steps.source.outputs.tag_object_sha }}
      source_ci_run_url: ${{ steps.ci.outputs.source_ci_run_url }}
    steps:
      - name: Checkout tagged repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify tag source and main ancestry
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/${GITHUB_REF_NAME}"
          tag_object_sha="$(git rev-parse "${GITHUB_REF}")"
          commit_sha="$(git rev-parse "${GITHUB_REF}^{commit}")"
          test "${commit_sha}" = "${GITHUB_SHA}"
          git fetch --force --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "${commit_sha}" "origin/main"
          echo "commit_sha=${commit_sha}" >> "${GITHUB_OUTPUT}"
          echo "tag_object_sha=${tag_object_sha}" >> "${GITHUB_OUTPUT}"

      - name: Validate SemVer and package release plan
        run: |
          python tools/release_image_plan.py \
            --tag "${GITHUB_REF_NAME}" \
            --repository "${GITHUB_REPOSITORY}" \
            --commit-sha "${{ steps.source.outputs.commit_sha }}" \
            --repo-root .

      - name: Verify exact main CI evidence
        id: ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/verify_release_source_ci.py \
            --repository "${GITHUB_REPOSITORY}" \
            --commit-sha "${{ steps.source.outputs.commit_sha }}" \
            --required-job "Code CI gate" \
            --required-job "Repository acceptance audit" \
            --timeout-seconds 1200 \
            --poll-interval-seconds 15 \
            --github-output "${GITHUB_OUTPUT}"

      - name: Summarize reused CI evidence
        env:
          SOURCE_CI_RUN_URL: ${{ steps.ci.outputs.source_ci_run_url }}
          VERIFIED_COMMIT_SHA: ${{ steps.source.outputs.commit_sha }}
        run: |
          {
            echo "### Release source CI"
            echo
            echo "- Commit: \`${VERIFIED_COMMIT_SHA}\`"
            echo "- Reused complete main CI: ${SOURCE_CI_RUN_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"

  release:
    name: Publish release image
    needs: [verify_main_code_ci]
    runs-on: ubuntu-latest
    concurrency:
      group: release-image-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify_main_code_ci.outputs.commit_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute release image plan and verify immutable tags
        id: plan
        env:
          VERIFIED_COMMIT_SHA: ${{ needs.verify_main_code_ci.outputs.commit_sha }}
        run: |
          python tools/release_image_plan.py \
            --tag "${GITHUB_REF_NAME}" \
            --repository "${GITHUB_REPOSITORY}" \
            --commit-sha "${VERIFIED_COMMIT_SHA}" \
            --repo-root . \
            --verify-immutable-image-tags-absent \
            --github-output "${GITHUB_OUTPUT}"

      - name: Reverify remote tag and main ancestry
        env:
          VERIFIED_COMMIT_SHA: ${{ needs.verify_main_code_ci.outputs.commit_sha }}
          VERIFIED_TAG_OBJECT_SHA: ${{ needs.verify_main_code_ci.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/${GITHUB_REF_NAME}"
          git fetch --force --no-tags origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/karkinos/release-tag"
          git fetch --force --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main"
          remote_tag_object_sha="$(git rev-parse "refs/karkinos/release-tag")"
          remote_tag_commit_sha="$(git rev-parse "refs/karkinos/release-tag^{commit}")"
          test "${remote_tag_object_sha}" = "${VERIFIED_TAG_OBJECT_SHA}"
          test "${remote_tag_commit_sha}" = "${VERIFIED_COMMIT_SHA}"
          git merge-base --is-ancestor "${VERIFIED_COMMIT_SHA}" "origin/main"

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.plan.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.plan.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify_main_code_ci.outputs.commit_sha }}
