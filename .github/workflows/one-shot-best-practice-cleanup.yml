name: One-shot engineering best-practice cleanup

# Temporary bridge: materialize validated workflow contents as ordinary files so
# the GitHub connector can publish them atomically and remove this workflow.
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/one-shot-best-practice-cleanup.yml

permissions:
  contents: write

jobs:
  stage-workflows:
    if: ${{ github.repository == 'imReese/Karkinos' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout current dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          persist-credentials: true
      - name: Materialize hardened workflow blobs
        shell: python
        run: |
          from pathlib import Path

          source = Path('.github/workflows')
          target = Path('.workflow-staging')
          target.mkdir(exist_ok=False)

          names = ('candidate.yml', 'ci.yml', 'governance.yml', 'promote-dev.yml', 'release.yml')
          for name in names:
              text = (source / name).read_text(encoding='utf-8')
              text = text.replace('runs-on: ubuntu-latest', 'runs-on: ubuntu-24.04')
              if name == 'ci.yml':
                  gitleaks = 'ghcr.io/gitleaks/gitleaks:v8.30.1'
                  pinned = gitleaks + '@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f'
                  if text.count(gitleaks) != 2:
                      raise SystemExit('unexpected Gitleaks invocation count')
                  text = text.replace(gitleaks, pinned)

                  shell_step = '''      - name: Check public shell entrypoints
                  run: bash -n scripts/start_server.sh scripts/stop_server.sh scripts/service/manage_launch_agent.sh scripts/release/bootstrap_installer.sh
          '''
                  shell_hardened = shell_step + '''      - name: Check public shell entrypoints with ShellCheck
                  run: shellcheck scripts/start_server.sh scripts/stop_server.sh scripts/service/manage_launch_agent.sh scripts/release/bootstrap_installer.sh
          '''
                  if text.count(shell_step) != 1:
                      raise SystemExit('unexpected shell entrypoint step')
                  text = text.replace(shell_step, shell_hardened, 1)

                  backend = '''      - run: uv run --locked python -m pytest -n 4 --dist loadfile --max-worker-restart=0 -m "not trading_safety"
          '''
                  backend_full = (
                      '      - name: Run backend test suite\n'
                      '        env:\n'
                      '          CI_MODE: $' + '{{ needs.plan.outputs.mode }}\n'
                      '        shell: bash\n'
                      '        run: |\n'
                      '          set -euo pipefail\n'
                      '          if [[ "${CI_MODE}" == full ]]; then\n'
                      '            mkdir -p reports/ci\n'
                      '            uv run --locked python -m pytest -n 4 --dist loadfile --max-worker-restart=0 \\\n'
                      '              --cov --cov-report=term --cov-report=xml\n'
                      '          else\n'
                      '            uv run --locked python -m pytest -n 4 --dist loadfile --max-worker-restart=0 \\\n'
                      '              -m "not trading_safety"\n'
                      '          fi\n'
                  )
                  if text.count(backend) != 1:
                      raise SystemExit('unexpected backend pytest command')
                  text = text.replace(backend, backend_full, 1)

              if 'ubuntu-latest' in text:
                  raise SystemExit(f'floating runner remains in {name}')
              (target / name).write_text(text, encoding='utf-8')
      - name: Verify staged workflow invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ubuntu-24.04' .workflow-staging/ci.yml
          grep -q 'shellcheck scripts/start_server.sh' .workflow-staging/ci.yml
          grep -q -- '--cov --cov-report=term --cov-report=xml' .workflow-staging/ci.yml
          grep -Fq 'CI_MODE: ${{ needs.plan.outputs.mode }}' .workflow-staging/ci.yml
          grep -q 'gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f' .workflow-staging/ci.yml
          ! grep -R 'ubuntu-latest' .workflow-staging
      - name: Commit staging blobs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Reese"
          git config user.email "63846933+imReese@users.noreply.github.com"
          git add -- .workflow-staging
          git diff --cached --check
          git commit -m "chore: stage hardened workflow blobs"
          git push origin HEAD:dev
