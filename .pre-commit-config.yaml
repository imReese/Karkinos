repos:
  - repo: local
    hooks:
      - id: ruff-correctness-locked
        name: Ruff correctness (uv locked)
        entry: uv run --frozen --extra dev ruff check
        language: system
        types: [python]
        require_serial: true
      - id: mypy-foundation-locked
        name: mypy foundational packages (uv locked)
        entry: uv run --frozen --extra dev mypy
        language: system
        pass_filenames: false
        files: ^((core|domain|risk|execution|notification)/.*\.py|pyproject\.toml)$
        require_serial: true
      - id: python-dependency-boundaries
        name: Python dependency boundaries
        entry: python tools/check_python_architecture.py
        language: system
        pass_filenames: false
        files: ^((core|domain|data|strategy|risk|execution|account_truth|notification|backtest)/.*\.py|tools/check_python_architecture\.py|tests/scripts/test_check_python_architecture\.py)$
      - id: isort-locked
        name: isort (uv locked)
        entry: uv run --frozen --extra dev isort
        language: system
        types: [python]
        require_serial: true
      - id: black-locked
        name: black (uv locked)
        entry: uv run --frozen --extra dev black
        language: system
        types: [python]
        require_serial: true
      - id: prettier-locked
        name: prettier (web lockfile)
        entry: web/node_modules/.bin/prettier --write
        language: system
        files: ^web/.*\.(ts|tsx|js|jsx|css|md|json)$
        require_serial: true
      - id: documentation-health
        name: documentation health
        entry: python scripts/check_docs_health.py
        language: system
        pass_filenames: false
        files: ^(README\.md|docs/.*\.md|AGENTS\.md|CLAUDE\.md)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
