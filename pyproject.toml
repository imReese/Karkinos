[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "karkinos"
dynamic = ["version"]
description = "面向中国市场的个人量化投研与交易平台"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.18.94",
    "tushare>=1.4.29",
    "tdxaidata>=1.0.2,<2",
    "pandas>=3.0.5",
    "numpy>=2.5.3",
    "pyarrow>=25.0.1",
    "httpx>=0.28.1",
    "cryptography>=50.0.1",
    "xlrd>=2.0.2",
    "ruff>=0.16.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "pip-audit==2.10.1",
    "pre-commit>=4.6.2",
    "mypy>=1.18.2",
]
server = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "python-dotenv>=1.2.3",
    "aiosqlite>=0.22.1",
    "websockets>=17.1",
    "pydantic>=2.13.5",
]

[project.urls]
Homepage = "https://github.com/imReese/Karkinos"
Repository = "https://github.com/imReese/Karkinos"
Issues = "https://github.com/imReese/Karkinos/issues"

[tool.setuptools.packages.find]
include = [
    "core", "core.*",
    "domain", "domain.*",
    "data", "data.*",
    "strategy", "strategy.*",
    "execution", "execution.*",
    "risk", "risk.*",
    "backtest", "backtest.*",
    "analytics", "analytics.*",
    "account_truth", "account_truth.*",
    "notification", "notification.*",
    "server", "server.*",
]

[tool.setuptools.dynamic]
version = {attr = "server.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: fast deterministic unit and service-level tests",
    "api_contract: API, persistence, and route contract tests",
    "trading_safety: fail-closed trading authority and financial-integrity tests",
    "product_smoke: high-value end-to-end product journeys",
    "slow: deterministic tests that intentionally exercise timeout or wait behavior",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "I"]

[tool.ruff.lint.isort]
known-first-party = ["core", "domain", "data", "strategy", "execution", "risk", "backtest", "analytics", "account_truth", "server"]

[tool.pyright]
include = [
    "account_truth",
    "analytics",
    "backtest",
    "core",
    "data",
    "domain",
    "execution",
    "notification",
    "risk",
    "server",
    "strategy",
    "tools",
]
exclude = [".venv", "web/node_modules", "**/__pycache__"]
venvPath = "."
venv = ".venv"
executionEnvironments = [{ root = ".", extraPaths = ["."] }]

[tool.mypy]
python_version = "3.12"
files = [
    "core", "domain", "risk", "execution", "notification",
    "analytics/metrics.py", "backtest/metrics.py", "server/config_types.py",
]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.coverage.run]
source = [
    "core",
    "domain",
    "data",
    "strategy",
    "execution",
    "risk",
    "backtest",
    "analytics",
    "account_truth",
    "notification",
    "server",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "reports/ci/coverage.xml"
